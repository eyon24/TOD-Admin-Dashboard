<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search"></div>
        <div class="profile"></div>
        <div class="greeting"></div>
        <div class="post"></div>
      </div>
      <div class="sidebar">
        <div class="logo">
          <img
            src="./images/view-dashboard-outline.svg"
            alt="Dashboard Logo"
            width="150"
            height="150"
          />
          Dashboard
        </div>
        <ul class="socialbtns">
          <li>Home</li>
          <li>Profile</li>
          <li>Messages</li>
          <li>History</li>
          <li>Tasks</li>
          <li>Communities</li>
        </ul>
        <ul class="supportbtns">
          <li>Settings</li>
          <li>Support</li>
          <li>Privacy</li>
        </ul>
      </div>
      <div class="content">
        <div class="projects"></div>
        <div class="announcements"></div>
        <div class="trending"></div>
      </div>
    </div>
  </body>
</html>
