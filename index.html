<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search">
          <img src="./images/magnify.svg" alt="search" width="30" height="30" />
          <input type="text" name="" id="" />
        </div>
        <div class="profile">
          <img
            src="./images/bell-ring-outline.svg"
            alt="notif-bell"
            width="20"
            height="20"
          />
          <img
            src="./images/pfp.jpg"
            alt="pfp"
            width="40"
            height="40"
            class="pfp-small"
          />
          <span>Eric Yon</span>
        </div>
        <div class="greeting">
          <img src="./images/pfp.jpg" alt="pfp" />
          <div class="greeting-msg">
            <span>Hi there,</span>
            <span class="handle">Eric Yon (@EricYonder)</span>
          </div>
        </div>
        <div class="post">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="logo sidebar-btn">
          <img src="./images/view-dashboard.svg" alt="Dashboard Logo" />
          Dashboard
        </div>
        <ul class="socialbtns">
          <div class="sidebar-btn">
            <img src="./images/home.svg" alt="Home" />
            <li>Home</li>
          </div>
          <div class="sidebar-btn">
            <img
              src="./images/card-account-details-outline.svg"
              alt="Profile"
            />
            <li>Profile</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/message-reply.svg" alt="Messages" />
            <li>Messages</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/history.svg" alt="History" />
            <li>History</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/note-multiple.svg" alt="Tasks" />
            <li>Tasks</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/account-group.svg" alt="Communities" />
            <li>Communities</li>
          </div>
        </ul>
        <ul class="supportbtns">
          <div class="sidebar-btn">
            <img src="./images/cog.svg" alt="Settings" />
            <li>Settings</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/help-box-outline.svg" alt="Support" />
            <li>Support</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/shield-check.svg" alt="Privacy" />
            <li>Privacy</li>
          </div>
        </ul>
      </div>
      <div class="content">
        <div class="projects">
          <div class="card">
            <span class="title"></span>
            <p class="description"></p>
          </div>
        </div>
        <div class="announcements"></div>
        <div class="trending"></div>
      </div>
    </div>
  </body>
</html>
