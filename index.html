<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search"></div>
        <div class="profile"></div>
        <div class="greeting"></div>
        <div class="post"></div>
      </div>
      <div class="sidebar">
        <div class="logo sidebar-btn">
          <img src="./images/view-dashboard.svg" alt="Dashboard Logo" />
          Dashboard
        </div>
        <ul class="socialbtns">
          <div class="sidebar-btn">
            <img src="./images/home.svg" alt="Home" width="100" height="100" />
            <li>Home</li>
          </div>
          <div class="sidebar-btn">
            <img
              src="./images/card-account-details-outline.svg"
              alt="Profile"
            />
            <li>Profile</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/message-reply.svg" alt="Messages" />
            <li>Messages</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/history.svg" alt="History" />
            <li>History</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/note-multiple.svg" alt="Tasks" />
            <li>Tasks</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/account-group.svg" alt="Communities" />
            <li>Communities</li>
          </div>
        </ul>
        <ul class="supportbtns">
          <div class="sidebar-btn">
            <img src="./images/cog.svg" alt="Settings" />
            <li>Settings</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/help-box-outline.svg" alt="Support" />
            <li>Support</li>
          </div>
          <div class="sidebar-btn">
            <img src="./images/shield-check.svg" alt="Privacy" />
            <li>Privacy</li>
          </div>
        </ul>
      </div>
      <div class="content">
        <div class="projects"></div>
        <div class="announcements"></div>
        <div class="trending"></div>
      </div>
    </div>
  </body>
</html>
